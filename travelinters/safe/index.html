<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src https://api.tripvo.app; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Tripvo</title>
<style>
body{margin:0;background:#f6f3ee;color:#1d2433;font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:560px;margin:0 auto;padding:24px 16px}
</style>
</head>
<body>
<main><p id="state">…</p><noscript><p>This page needs JavaScript to show the shared plan.</p></noscript></main>
<script>
// The safety page a traveller shared (served by the Cloudflare Worker, cloudflare/src/domains/wp05; formerly supabase/functions/safety-share).
//
// This file is only a frame. Supabase serves HTML from *.supabase.co as text/plain, so
// the page is fetched here and put on screen. The token is the part of the address after
// "#": browsers never send that part to this host, and it is posted in a request body,
// so it appears in no URL and no access log. Nothing is stored and nothing else is loaded.
(function () {
  var endpoint = "https://api.tripvo.app/functions/v1/safety-share";
  var token = (location.hash || "").replace(/^#/, "");
  var language = new URLSearchParams(location.search).get("lang");
  var failures = {
    ar: "تعذّر تحميل الصفحة. تحقّق من اتصالك وأعد المحاولة.",
    "zh-Hans": "无法加载页面。请检查网络连接并重试。",
    "zh-Hant": "無法載入頁面。請檢查網路連線並重試。",
    sv: "Sidan kunde inte laddas. Kontrollera anslutningen och försök igen.",
    fi: "Sivua ei voitu ladata. Tarkista yhteys ja yritä uudelleen.",
    ro: "Pagina nu a putut fi încărcată. Verifică conexiunea și încearcă din nou.",
    cs: "Stránku se nepodařilo načíst. Zkontroluj připojení a zkus to znovu.",
    th: "โหลดหน้าไม่ได้ โปรดตรวจสอบการเชื่อมต่อแล้วลองอีกครั้ง",
    ms: "Halaman tidak dapat dimuatkan. Semak sambungan dan cuba lagi.",
    id: "Halaman tidak dapat dimuat. Periksa koneksi dan coba lagi.",
    vi: "Không thể tải trang. Hãy kiểm tra kết nối và thử lại."
,
    "el": "Δεν ήταν δυνατή η φόρτωση της σελίδας. Έλεγξε τη σύνδεσή σου και δοκίμασε ξανά.",
    "hu": "Az oldal nem tölthető be. Ellenőrizd a kapcsolatot, és próbáld újra.",
    "sk": "Stránku sa nepodarilo načítať. Skontroluj pripojenie a skús to znova.",
    "sl": "Strani ni bilo mogoče naložiti. Preveri povezavo in poskusi znova.",
    "hr": "Stranica se nije mogla učitati. Provjeri vezu i pokušaj ponovno.",
    "hi": "पेज लोड नहीं हो सका। अपना इंटरनेट कनेक्शन जाँचें और फिर से कोशिश करें।",
    "uk": "Не вдалося завантажити сторінку. Перевір з’єднання та спробуй ще раз."
  };
  function failureLanguage(tag) {
    tag = String(tag || "").toLowerCase().replace(/_/g, "-");
    if (/^zh(?:-|$)/.test(tag)) {
      if (/-hant(?:-|$)/.test(tag)) return "zh-Hant";
      if (/-hans(?:-|$)/.test(tag)) return "zh-Hans";
      return /-(tw|hk|mo)(?:-|$)/.test(tag) ? "zh-Hant" : "zh-Hans";
    }
    return tag.split("-")[0];
  }
  var fallbackLanguage = failureLanguage(language || (navigator.languages || [navigator.language])[0]);
  document.documentElement.lang = fallbackLanguage || "en";
  document.documentElement.dir = fallbackLanguage === "ar" ? "rtl" : "ltr";

  fetch(endpoint + (language ? "?lang=" + encodeURIComponent(language) : ""), {
    method: "POST",
    // text/plain keeps this a simple request (no preflight).
    headers: { "content-type": "text/plain" },
    body: JSON.stringify({ token: token }),
    cache: "no-store",
    credentials: "omit",
    referrerPolicy: "no-referrer"
  }).then(function (response) {
    return response.text().then(function (html) {
      var parsed = new DOMParser().parseFromString(html, "text/html");
      // Markup and styles only: nothing in the answer is executed.
      parsed.querySelectorAll("script, link, iframe, object, embed, base, meta[http-equiv]").forEach(function (node) { node.remove(); });
      document.documentElement.lang = response.headers.get("content-language") || parsed.documentElement.lang || "en";
      document.documentElement.dir = parsed.documentElement.dir || "ltr";
      document.title = parsed.title || document.title;
      document.head.querySelectorAll("style").forEach(function (node) { node.remove(); });
      parsed.head.querySelectorAll("style").forEach(function (node) { document.head.appendChild(document.importNode(node, true)); });
      document.body.replaceChildren.apply(document.body, Array.prototype.map.call(parsed.body.childNodes, function (node) {
        return document.importNode(node, true);
      }));
    });
  }).catch(function () {
    document.getElementById("state").textContent = failures[fallbackLanguage] || "This page could not be loaded. Check your connection and reload.";
  });
})();
</script>
</body>
</html>
